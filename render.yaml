# Despliegue del backend en Render (https://render.com)
#
# Con este archivo, Render configura el servicio solo:
#   1. Entra a render.com y crea un "Blueprint" (New > Blueprint).
#   2. Apunta al repositorio https://github.com/Dani062/Bolivar
#   3. Render lee este archivo y crea el web service.
#
# Ojo: MONGO_URI hay ponerla a mano (en el panel de Render > Environment),
# porque es la credencial de tu cluster de Atlas. JWT_SECRET la genera
# Render sola.
services:
  - type: web
    name: bolivar-aprende-y-trabaja-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@bolivar.com
      - key: ADMIN_PASSWORD
        value: admin123
